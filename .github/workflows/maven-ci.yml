name: Java Spring Boot CI

# 1. Define when the workflow should run
on:
  push:
    branches: [ main, develop ] # Run when code is pushed to these branches
  pull_request:
    branches: [ main ]          # Run when a pull request targets the 'main' branch

# 2. Define the jobs (tasks) to be executed
jobs:
  build:
    # 3. Specify the runner environment
    runs-on: ubuntu-latest

    # 4. Define the steps for the job
    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Grant Execute Permission to the Maven Wrapper
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Caches Maven dependencies for faster builds

      # Step 3: Clean and Build the project
      # The 'verify' goal runs the full build lifecycle, including compilation and tests.
      - name: Build with Maven
        run: |
          # Use the Maven Wrapper for the build
          ./mvnw clean verify

      # (Optional) Step 4: Upload the JAR artifact (useful for deployment steps later)
      - name: Upload Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: task-management-jar
          path: target/*.jar # Adjust if your jar name is different